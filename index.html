<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Rita Ruivo</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffd6e8;
        -webkit-tap-highlight-color: transparent;
      }

      /* Viewport = frame; vídeo enche sempre (cover); rosa claro só antes de carregar */
      .stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: block;
        background: #ffd6e8;
      }

      .stage__inner {
        position: absolute;
        inset: 0;
      }

      /*
        Tall screen + landscape master: rotate 90° so the long edge of the
        phone matches the video; video still uses cover (full bleed, crop).
      */
      .stage--rotated .stage__inner {
        inset: auto;
        width: 100vh;
        height: 100vw;
        left: 50%;
        top: 50%;
        margin-left: -50vh;
        margin-top: -50vw;
        transform: rotate(90deg);
        transform-origin: center center;
      }

      /* Wide screen + portrait master: same idea, opposite rotation */
      .stage--rotated-ccw .stage__inner {
        inset: auto;
        width: 100vh;
        height: 100vw;
        left: 50%;
        top: 50%;
        margin-left: -50vh;
        margin-top: -50vw;
        transform: rotate(-90deg);
        transform-origin: center center;
      }

      @supports (height: 100dvh) {
        .stage--rotated .stage__inner,
        .stage--rotated-ccw .stage__inner {
          width: 100dvh;
          height: 100dvw;
          margin-left: -50dvh;
          margin-top: -50dvw;
        }
      }

      video {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="stage__inner">
        <video
          id="portfolio"
          src="https://pub-3b011c7ca5eb4317a6f3513a80528592.r2.dev/portfolio.mp4"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
        ></video>
      </div>
    </div>
    <script>
      (function () {
        var v = document.getElementById("portfolio");
        var stage = document.getElementById("stage");
        var resizeTimer;

        function tryPlay() {
          var p = v.play();
          if (p && typeof p.catch === "function") {
            p.catch(function () {});
          }
        }

        function updateRotateFit() {
          var vw = window.innerWidth;
          var vh = window.innerHeight;
          var iw = v.videoWidth;
          var ih = v.videoHeight;
          if (!iw || !ih || !vw || !vh) return;
          var tallScreen = vh > vw;
          var wideScreen = vw > vh;
          var landscapeVideo = iw > ih;
          var portraitVideo = iw < ih;
          stage.classList.toggle("stage--rotated", tallScreen && landscapeVideo);
          stage.classList.toggle(
            "stage--rotated-ccw",
            wideScreen && portraitVideo
          );
        }

        function scheduleRotateFit() {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(updateRotateFit, 50);
        }

        tryPlay();
        v.addEventListener("loadeddata", tryPlay, { once: true });
        v.addEventListener("loadedmetadata", function () {
          updateRotateFit();
          tryPlay();
        });

        window.addEventListener("resize", scheduleRotateFit);
        window.addEventListener("orientationchange", function () {
          setTimeout(updateRotateFit, 120);
          setTimeout(updateRotateFit, 350);
        });

        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) tryPlay();
        });

        window.addEventListener("pageshow", function (e) {
          if (e.persisted) tryPlay();
          updateRotateFit();
        });
      })();
    </script>
  </body>
</html>
